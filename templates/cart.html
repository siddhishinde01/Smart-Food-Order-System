<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cart — FoodTech</title>
<link rel="stylesheet" href="/static/css/style.css"/>
<style>
.cart-page{display:grid;grid-template-columns:1fr 340px;gap:1.5rem;align-items:start}
.cart-item-row{display:flex;align-items:center;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--gray-100)}
.cart-item-emoji{font-size:2rem;width:50px;height:50px;background:var(--purple-50);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cart-item-info{flex:1}
.cart-item-name{font-weight:700;font-size:.95rem}
.cart-item-sub{font-size:.78rem;color:var(--gray-500);margin-top:.1rem}
.qty-ctrl{display:flex;align-items:center;gap:.5rem;background:var(--gray-50);border-radius:10px;padding:.35rem .5rem}
.qty-btn2{width:30px;height:30px;border-radius:8px;border:1px solid var(--gray-200);background:white;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition)}
.qty-btn2:hover{background:var(--purple-50);border-color:var(--primary);color:var(--primary)}
.summary-row{display:flex;justify-content:space-between;padding:.5rem 0;font-size:.88rem;color:var(--gray-600)}
.summary-row.total{font-size:1rem;font-weight:800;color:var(--gray-900);padding-top:.75rem;border-top:1.5px solid var(--gray-200);margin-top:.5rem}
@media(max-width:768px){.cart-page{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav class="navbar">
  <a href="/" class="navbar-brand"><div class="logo-icon">🍔</div>FoodTech</a>
  <div class="navbar-links">
    <a href="/">Home</a>
    <a href="/dashboard" class="dashboard-btn">⚡ Command Center</a>
  </div>
</nav>

<div class="container">
  <div class="page-content">
    <div class="section-title">🛒 Your Cart</div>
    <div class="section-subtitle">Review your order before checkout</div>

    <div id="empty-cart" style="display:none">
      <div class="empty-state card card-body">
        <div class="empty-icon">🛒</div>
        <h3>Your cart is empty</h3>
        <p>Browse our restaurants and add some delicious food!</p>
        <a href="/" class="btn btn-primary mt-3" style="margin:1.5rem auto 0">Browse Restaurants</a>
      </div>
    </div>

    <div class="cart-page" id="cart-content">
      <!-- Items -->
      <div class="card">
        <div class="card-header">
          <span class="card-title">🍽️ Order Items</span>
          <button onclick="clearCart()" class="btn btn-secondary btn-sm">Clear All</button>
        </div>
        <div class="card-body" id="cart-items-container"></div>
      </div>

      <!-- Summary -->
      <div>
        <div class="card" style="position:sticky;top:calc(var(--nav-h) + 1rem)">
          <div class="card-header"><span class="card-title">📋 Order Summary</span></div>
          <div class="card-body">
            <div class="summary-row"><span>Subtotal</span><span id="s-subtotal">₹0</span></div>
            <div class="summary-row"><span>Delivery Fee</span><span>₹40</span></div>
            <div class="summary-row"><span>Tax (5%)</span><span id="s-tax">₹0</span></div>
            <div class="summary-row total"><span>Total</span><span id="s-total">₹0</span></div>
            <div id="restaurant-info" style="margin:1rem 0;padding:.75rem;background:var(--purple-50);border-radius:var(--radius);font-size:.82rem;color:var(--purple-700)"></div>
            <button class="btn btn-primary w-full btn-lg" onclick="goCheckout()">Proceed to Checkout →</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="/static/js/app.js"></script>
<script>
const RESTAURANTS = {{ restaurants|tojson }};
const MENU_ITEMS  = {{ menu_items|tojson }};
const menuDict    = Object.fromEntries(MENU_ITEMS.map(m=>[m.id,m]));
const restDict    = Object.fromEntries(RESTAURANTS.map(r=>[r.id,r]));

function renderCart(){
  const cart = getCart();
  if(!cart.length){
    document.getElementById('empty-cart').style.display='block';
    document.getElementById('cart-content').style.display='none';
    return;
  }
  document.getElementById('empty-cart').style.display='none';
  document.getElementById('cart-content').style.display='grid';

  let subtotal=0;
  let html='';
  cart.forEach(item=>{
    const itemId = item.menu_id || item.id;
    const menu = menuDict[itemId]||{};
    const price = Number(item.price)||0;
    const qty = Number(item.qty)||1;
    const lineTotal = price*qty;
    subtotal+=lineTotal;
    html+=`<div class="cart-item-row">
      <div class="cart-item-emoji">${menu.emoji||'🍽️'}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${item.name}</div>
        <div class="cart-item-sub">₹${price} each &nbsp;•&nbsp; ${menu.prep_time||'?'} min prep</div>
      </div>
      <div class="qty-ctrl">
        <button class="qty-btn2" onclick="updateQty('${itemId}',-1)">−</button>
        <span style="width:24px;text-align:center;font-weight:700">${qty}</span>
        <button class="qty-btn2" onclick="updateQty('${itemId}',1)">+</button>
      </div>
      <span style="font-weight:800;font-size:.95rem;color:var(--primary);min-width:60px;text-align:right">₹${lineTotal}</span>
    </div>`;
  });
  document.getElementById('cart-items-container').innerHTML=html;

  const tax   = Math.round(subtotal*0.05);
  const total = subtotal+40+tax;
  document.getElementById('s-subtotal').textContent='₹'+subtotal;
  document.getElementById('s-tax').textContent='₹'+tax;
  document.getElementById('s-total').textContent='₹'+total;

  if(cart[0]){
    const restId = cart[0].restaurant_id;
    const rest = restDict[restId]||{};
    const restName = rest.name || cart[0].restaurant_name || 'Restaurant';
    const restRating = rest.rating || '—';
    const restPrep = rest.prep_base_time || 20;
    document.getElementById('restaurant-info').innerHTML=`🏪 <strong>${restName}</strong> &nbsp;•&nbsp; ⭐ ${restRating} &nbsp;•&nbsp; ~${restPrep} min prep`;
  }
  updateCartBadge();
}

function updateQty(id,delta){
  let cart=getCart();
  const itemId = String(id);
  const item=cart.find(i=>(i.menu_id===itemId || i.id===itemId));
  if(!item) return;
  item.qty = (Number(item.qty)||0) + delta;
  if(item.qty<=0) cart=cart.filter(i=>(i.menu_id!==itemId && i.id!==itemId));
  saveCart(cart);
  renderCart();
}

function clearCart(){
  if(confirm('Clear entire cart?')){ localStorage.removeItem('ft_cart'); renderCart(); }
}

function goCheckout(){
  const cart=getCart();
  if(!cart.length){ showToast('Cart is empty!','error'); return; }
  window.location.href='/checkout';
}

renderCart();
</script>
</body>
</html>
